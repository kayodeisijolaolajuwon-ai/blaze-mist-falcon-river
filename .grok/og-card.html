<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Fraunces";
    src: url("fonts/Fraunces.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: "Source Serif 4";
    src: url("fonts/SourceSerif4.ttf") format("truetype");
    font-weight: 100 900;
    font-style: normal;
    font-display: block;
  }
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #f4efe6;
    color: #1c1915;
  }
  .sheet {
    box-sizing: border-box;
    width: 1200px;
    height: 630px;
    padding: 48px;
    background:
      radial-gradient(ellipse at 50% 42%, #fffdf8 0%, #f4efe6 62%, #efe6d8 100%);
  }
  .frame {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    border: 1px solid #1c1915;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .kicker {
    margin: 0 0 28px;
    font-family: "Source Serif 4", "Liberation Serif", serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #b5452a;
  }
  h1 {
    margin: 0;
    font-family: "Fraunces", "Liberation Serif", serif;
    font-weight: 560;
    font-variation-settings: "opsz" 144, "SOFT" 40, "WONK" 1;
    font-size: 128px;
    line-height: 0.84;
    letter-spacing: -0.035em;
  }
  .rule {
    width: 64px;
    height: 3px;
    margin: 30px 0 22px;
    background: #b5452a;
  }
  .tag {
    margin: 0;
    font-family: "Source Serif 4", "Liberation Serif", serif;
    font-weight: 460;
    font-size: 22px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="frame">
      <p class="kicker">Issue 14</p>
      <h1>Hearth<br>Ledger</h1>
      <div class="rule"></div>
      <p class="tag">A small paid magazine</p>
    </div>
  </div>
</body>
</html>
